<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nikonov</title>
<link rel="stylesheet" href="bg.css" />
<style>
  :root{
    --bg:#0d0c0a;
    --bg2:#151310;
    --panel:#1c1914;
    --panel2:#232019;
    --line:#3a3428;
    --line2:#4a4232;
    --text:#efe6d2;
    --muted:#b9ad93;
    --dim:#8a7f68;
    --accent:#3abf9c;
    --accent2:#7ad9b6;
    --amber:#8fe3c8;
    --olive:#6aa38a;
    --khaki:#a9d4c1;
    --rust:#2f8b76;
    --cream:#e6f5ee;
    --mono:"IBM Plex Mono","JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:"Inter","Segoe UI",Roboto,Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .home{
    position:relative;
    z-index:2;
    width:100%;
    max-width:880px;
    padding:64px 24px;
  }

  .user{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.28em;
    text-transform:lowercase;
    color:var(--dim);
    margin-bottom:14px;
  }
  .user b{
    color:var(--accent2);
    font-weight:600;
    letter-spacing:.28em;
  }

  .skills{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:5px;
    margin-bottom:28px;
  }
  .skill{
    border:1px solid var(--line2);
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    padding:5px 6px;
    border-radius:2px;
    text-align:center;
    font-family:var(--mono);
    font-size:clamp(.55rem, .9vw, .72rem);
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent2);
    position:relative;
    overflow:hidden;
    white-space:nowrap;
    transition:border-color .25s, transform .25s, color .25s;
  }
  .skill::before{
    content:"";
    position:absolute; left:0; top:0; width:1px; height:100%;
    background:linear-gradient(180deg, var(--accent), transparent);
  }
  .skill:hover{
    border-color:var(--accent);
    color:var(--cream);
    transform:translateY(-1px);
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .links a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--khaki);
    border:1px solid var(--line2);
    background:var(--panel);
    padding:9px 14px;
    border-radius:2px;
    transition:.25s;
  }
  .links a:hover{
    border-color:var(--accent);
    color:var(--cream);
    background:var(--panel2);
  }
  .links a.primary{
    color:var(--cream);
    border-color:var(--accent);
    background:rgba(58,191,156,.10);
    box-shadow:0 0 24px -10px rgba(58,191,156,.5);
  }
  .links a.primary:hover{
    background:rgba(58,191,156,.18);
    box-shadow:0 0 32px -8px rgba(58,191,156,.75);
  }
  .links a .arrow{
    color:var(--accent2);
    transition:transform .25s;
  }
  .links a.primary:hover .arrow{transform:translateX(3px)}

  @media (max-width:600px){
    .skills{grid-template-columns:1fr}
    .links a{flex:1 1 auto; justify-content:center}
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="bg-orbits">
  <div class="bg-orbits__system">
    <div class="orbit orbit--1"><span class="orbit__planet"></span></div>
    <div class="orbit orbit--2"><span class="orbit__planet"></span></div>
    <div class="orbit orbit--3"><span class="orbit__planet"></span></div>
    <div class="orbit orbit--4"></div>
  </div>
</div>

<main class="home">
  <div class="user">user: <b>nikonov</b></div>

  <div class="skills">
    <div class="skill">Virtualization</div>
    <div class="skill">Linux</div>
    <div class="skill">Automation</div>
  </div>

  <div class="links">
    <a href="https://t.me/ONL_Max_Nik" target="_blank" rel="noopener">Telegram <span class="arrow">↗</span></a>
    <a href="https://github.com/Sornodod" target="_blank" rel="noopener">GitHub <span class="arrow">↗</span></a>
    <a href="resume.html" class="primary">CV <span class="arrow">→</span></a>
  </div>
</main>

</body>
</html>
