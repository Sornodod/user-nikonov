<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" 
content="width=device-width, initial-scale=1.0" /> <title>404 — not found</title> <link 
rel="icon" type="image/png" href="/favicon.png" /> <link rel="stylesheet" href="/bg.css" /> 
<style>
  html, body{ margin:0; height:100%; background:#0a0a0a; color:#e6f5ee; font-family:"IBM Plex 
    Mono","JetBrains Mono","SFMono-Regular",Consolas,monospace; overflow:hidden;
  }
  .wrap{ position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; 
    align-items:center; justify-content:center; gap:28px; text-align:center; padding:32px 
    24px;
  }
  h1{ margin:0; font-size:clamp(3.5rem, 14vw, 9rem); line-height:1; letter-spacing:.08em; 
    color:#3abf9c; text-shadow:0 0 60px rgba(58,191,156,.4);
  }
  .subtitle{ margin:0; font-size:clamp(.8rem, 1.5vw, 1rem); letter-spacing:.35em; 
    text-transform:uppercase; color:#a9d4c1;
  }
  .sticker{ max-width:min(280px, 55vw); max-height:32vh; display:block;
  }
  .back{ margin-top:8px; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; 
    color:#7ad9b6; text-decoration:none; border-bottom:1px dashed #7ad9b6; padding-bottom:2px; 
    transition:color .2s, border-color .2s;
  }
  .back:hover{ color:#e6f5ee; border-bottom-color:#e6f5ee;
  }
</style> </head> <body> <div class="bg-grid"></div> <div class="bg-orbits"> <div 
  class="bg-orbits__system">
    <div class="orbit orbit--1"></div> <div class="orbit orbit--2"></div> <div class="orbit 
    orbit--3"></div> <div class="orbit orbit--4"></div>
  </div> </div> <main class="wrap"> <h1>404</h1> <p class="subtitle">There is nothing here</p> 
  <img class="sticker" src="/404.gif" alt="404" /> <a class="back" href="/">← back home</a>
</main> </body>
</html>
